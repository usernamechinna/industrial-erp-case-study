<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A to-do list with local storage persistence." />
    <title>Focus List | To-do</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="title">
      <header class="header">
        <div>
          <p class="eyebrow">Your daily workspace</p>
          <h1 id="title">Focus <span>List</span></h1>
        </div>
        <div id="progress-ring" class="progress-ring" aria-label="0 percent complete">
          <span id="progress-value">0%</span>
        </div>
      </header>

      <form id="task-form" class="composer">
        <label class="sr-only" for="task-input">Task description</label>
        <input id="task-input" name="task" maxlength="140" placeholder="What needs to be done?" autocomplete="off" required />
        <button type="submit">Add task <span aria-hidden="true">+</span></button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>
        <button id="clear-completed" class="text-button" type="button">Clear completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">No tasks here yet. Add one above to get started.</p>
      <footer><span id="task-count">0 tasks left</span><span>Saved automatically in your browser</span></footer>
    </main>
    <script src="todo.js" defer></script>
  </body>
</html>
